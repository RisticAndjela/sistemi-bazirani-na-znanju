services:
  postgres:
    image: postgres:16
    container_name: sbnz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sbnz_respiratory
      POSTGRES_USER: sbnz_user
      POSTGRES_PASSWORD: sbnz_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres-data:
